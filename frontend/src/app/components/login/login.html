<div class="login-container">
  <h2>{{ isRegister ? 'Register' : 'Login' }}</h2>

  <div class="form-group">
    <label>Username:</label>
    <input [(ngModel)]="username" type="text" placeholder="Username" class="form-control">
  </div>

  <div class="form-group">
    <label>Password:</label>
    <input [(ngModel)]="password" type="password" placeholder="Password" class="form-control">
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  
  @if (success()) {
    <p class="success">{{ success() }}</p>
  }

  <button (click)="submit()" [disabled]="!username || !password">
    {{ isRegister ? 'Register' : 'Login' }}
  </button>

  <button class="btn-toggle" (click)="toggleMode()">
    {{ isRegister ? 'Already have an account? Login' : 'No account? Register' }}
  </button>
</div>
