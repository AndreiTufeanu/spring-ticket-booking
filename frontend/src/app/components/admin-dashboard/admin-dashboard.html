<div class="admin-container">
    <header class="admin-header">
        <h1>Admin Panel ({{ currentUsername }})</h1>
        <button class="btn-back" (click)="logout()">
            Logout
        </button>
    </header>

    <nav class="admin-tabs">
        <button
            class="tab-btn"
            [class.active]="activeTab() === 'events'"
            (click)="setTab('events')">
            Events Management
        </button>
        <button
            class="tab-btn"
            [class.active]="activeTab() === 'categories'"
            (click)="setTab('categories')">
            Categories Management
        </button>
    </nav>

    @if (activeTab() === 'events') {
    <app-events-management></app-events-management>
    }

    @if (activeTab() === 'categories') {
    <app-categories-management></app-categories-management>
    }
</div>
