<div class="user-dashboard-container">
    <header class="user-header">
        <h1>User Dashboard ({{ currentUsername }})</h1>
        <button class="btn-back" (click)="logout()">
            Logout
        </button>
    </header>

    <nav class="user-tabs">
        <button
            class="tab-btn"
            [class.active]="activeTab() === 'bookings'"
            (click)="setTab('bookings')">
            My Bookings
        </button>
        <button
            class="tab-btn"
            [class.active]="activeTab() === 'ai-helper'"
            (click)="setTab('ai-helper')">
            AI Assistant
        </button>
    </nav>

    @if (activeTab() === 'bookings') {
    <app-user-bookings></app-user-bookings>
    }

    @if (activeTab() === 'ai-helper') {
    <app-ai-helper></app-ai-helper>
    }
</div>
