services:
  mysql-db:
    image: mysql:26.7.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_DATABASE=ticketdb
    secrets:
      - mysql_root_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root --password=$$(cat /run/secrets/mysql_root_password)"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  ticket-booking:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
      - MYSQL_HOST=mysql-db
      - MYSQL_USERNAME=root
      - MYSQL_PORT=3306
      - MYSQL_DB=ticketdb
      - OLLAMA_BASE_URL=http://localhost:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
    secrets:
      - mysql_root_password
      - jwt_secret_key
    networks:
      - app-network
    depends_on:
      mysql-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"
    networks:
      - app-network
    depends_on:
      - ticket-booking

volumes:
  mysql-data:
  qdrant-data:

networks:
  app-network:
    driver: bridge

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt